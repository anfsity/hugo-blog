{{- define "main" -}}
<article class="main-article">
  <header class="main-article-header">
    {{ partial "article/components/header" . }}
  </header>

  <section class="main-article-content">
    {{ .Content }}

    <div class="gallery-wrapper" id="fluent-gallery-wrapper">
      <div class="fluent-grid" id="fluent-gallery">
        <!-- Images will be injected here -->
      </div>
      <div class="loading-more" id="loading-indicator">
        <div class="spinner"></div>
        <span>Loading...</span>
      </div>
    </div>
  </section>

  <footer class="main-article-footer">{{ partial "footer/footer" . }}</footer>
</article>

<style>
  /* Fluent Design & Masonry Layout Variables */
  :root {
    --fluent-reveal-bg: rgba(0, 0, 0, 0.08);
    --fluent-reveal-border: rgba(0, 0, 0, 0.15);
    --fluent-card-bg: var(--card-background);
    --gallery-columns: 3;
  }

  [data-scheme="dark"] {
    --fluent-reveal-bg: rgba(255, 255, 255, 0.1);
    --fluent-reveal-border: rgba(255, 255, 255, 0.25);
  }

  @media (max-width: 1024px) {
    :root {
      --gallery-columns: 2;
    }
  }
  @media (max-width: 600px) {
    :root {
      --gallery-columns: 1;
    }
  }

  .gallery-wrapper {
    margin: 2rem 0;
    width: 100%;
    position: relative;
  }

  .fluent-grid {
    column-count: var(--gallery-columns);
    column-gap: 16px;
    width: 100%;
  }

  .fluent-card {
    position: relative;
    background: var(--fluent-card-bg);
    border-radius: var(--card-border-radius, 8px);
    margin-bottom: 16px;
    break-inside: avoid;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition:
      transform 0.2s cubic-bezier(0.2, 0, 0, 1),
      box-shadow 0.2s;
    min-height: 200px;
  }

  .fluent-card.skeleton {
    animation: skeleton-pulse 1.5s infinite ease-in-out;
  }

  @keyframes skeleton-pulse {
    0% {
      background: rgba(128, 128, 128, 0.1);
    }
    50% {
      background: rgba(128, 128, 128, 0.25);
    }
    100% {
      background: rgba(128, 128, 128, 0.1);
    }
  }

  .fluent-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-l);
    z-index: 10;
  }

  .fluent-card:not(.skeleton)::before,
  .fluent-card:not(.skeleton)::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 3;
    border-radius: inherit;
  }

  .fluent-card:not(.skeleton)::before {
    background: radial-gradient(
      800px circle at var(--mouse-x, -9999px) var(--mouse-y, -9999px),
      var(--fluent-reveal-bg),
      transparent 40%
    );
  }

  .fluent-card:not(.skeleton)::after {
    background: radial-gradient(
      600px circle at var(--mouse-x, -9999px) var(--mouse-y, -9999px),
      var(--fluent-reveal-border),
      transparent 40%
    );
    padding: 1.5px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }

  .fluent-grid:hover .fluent-card:not(.skeleton)::before,
  .fluent-grid:hover .fluent-card:not(.skeleton)::after {
    opacity: 1;
  }

  .fluent-card-inner {
    position: relative;
    z-index: 2;
    border-radius: calc(var(--card-border-radius, 8px) - 1.5px);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  .fluent-card img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: cover;
    opacity: 0;
    transition:
      opacity 0.4s ease-out,
      transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .fluent-card.loaded {
    background: var(--fluent-card-bg);
    min-height: auto;
  }

  .fluent-card.loaded img {
    opacity: 1;
  }

  .fluent-card.loaded:hover img {
    transform: scale(1.03);
  }

  .loading-more {
    text-align: center;
    padding: 2rem 0;
    color: var(--body-text-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid transparent;
    border-top-color: var(--accent-color);
    border-radius: 50%;
    animation: spin 0.8s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
  }

  @keyframes spin {
    100% {
      transform: rotate(360deg);
    }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(15px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

<script>
  (function () {
    const initGallery = () => {
      const wrapper = document.getElementById("fluent-gallery-wrapper");
      const gallery = document.getElementById("fluent-gallery");
      const loader = document.getElementById("loading-indicator");
      if (!gallery || gallery.dataset.init === "true") return;
      gallery.dataset.init = "true";

      wrapper.addEventListener("mousemove", (e) => {
        for (const card of document.getElementsByClassName("fluent-card")) {
          if (card.classList.contains("skeleton")) continue;
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          card.style.setProperty("--mouse-x", `${x}px`);
          card.style.setProperty("--mouse-y", `${y}px`);
        }
      });

      const apiConfigs = [
        {
          getUrl: () => {
            const c = ["neko", "waifu", "kitsune"];
            return `https://nekos.best/api/v2/${c[Math.floor(Math.random() * c.length)]}`;
          },
          parse: (d) => d.results[0].url,
        },
        {
          getUrl: () => "https://pic.re/image.json",
          parse: (d) => `https://${d.file_url}`,
        },
        {
          getUrl: () => "https://api.nekosia.cat/api/v1/images/random",
          parse: (d) => d.image.original.url,
        },
        {
          getUrl: () => "https://api.waifu.im/search?is_nsfw=false",
          parse: (d) => d.images[0].url,
        },
      ];

      const fetchedUrls = new Set();
      let isFetching = false;

      // 并发请求单张图片
      async function fetchOneImage() {
        const api = apiConfigs[Math.floor(Math.random() * apiConfigs.length)];
        try {
          const res = await fetch(api.getUrl());
          if (!res.ok) return null;
          const data = await res.json();
          const url = api.parse(data);

          if (fetchedUrls.has(url)) return null;
          fetchedUrls.add(url);
          return url;
        } catch (err) {
          return null;
        }
      }

      function createSkeletonCard() {
        const card = document.createElement("div");
        card.className = "fluent-card skeleton";
        card.style.animationDelay = `${Math.random() * 0.2}s`;

        const inner = document.createElement("div");
        inner.className = "fluent-card-inner";

        card.appendChild(inner);
        gallery.appendChild(card);
        return card;
      }

      async function loadIndividually(cardElement) {
        let url = null;
        for (let i = 0; i < 2; i++) {
          url = await fetchOneImage();
          if (url) break;
        }

        if (!url) {
          cardElement.remove();
          return;
        }

        const img = new Image();
        img.alt = "Artwork";
        img.onload = () => {
          cardElement.classList.remove("skeleton");
          cardElement.classList.add("loaded");
        };
        img.onerror = () => {
          cardElement.remove();
        };
        img.src = url;

        cardElement.querySelector(".fluent-card-inner").appendChild(img);
      }

      async function loadBatch(count = 6) {
        if (isFetching) return;
        isFetching = true;
        loader.style.opacity = "1";

        const skeletons = Array.from({ length: count }).map(() =>
          createSkeletonCard(),
        );

        const promises = skeletons.map((sk) => loadIndividually(sk));

        await Promise.allSettled(promises);

        loader.style.opacity = "0";
        isFetching = false;

        if (document.body.scrollHeight <= window.innerHeight + 100) {
          loadBatch(3);
        }
      }

      loadBatch(6);

      const observer = new IntersectionObserver(
        (entries) => {
          if (entries[0].isIntersecting && !isFetching) {
            loadBatch(3);
          }
        },
        { rootMargin: "600px" },
      );

      observer.observe(loader);
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initGallery);
    } else {
      initGallery();
    }
    document.addEventListener("turbo:load", initGallery);
  })();
</script>
{{- end -}}
