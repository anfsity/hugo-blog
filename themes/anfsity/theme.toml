# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "Anfsity"
license = "GPL-3.0-only"
licenselink = "https://www.gnu.org/licenses/gpl-3.0.html"
description = "Locally maintained Hugo theme for the Anfsity blog"
homepage = "https://anfsity.com"
demosite = "https://anfsity.com"

tags = ["blog", "responsive", "clean", "light", "dark", "personal"]

features = [
    "disqus",
    "photoswipe",
    "opengraph",
    "widgets",
    "darkmode",
    "table of contents",
    "search",
]

min_version = "0.123.0"

[author]
name = "Anfsity"
homepage = "https://anfsity.com"
