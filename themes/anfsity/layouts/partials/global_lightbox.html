<div id="elegant-lightbox" class="elegant-lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true" tabindex="-1" inert>
  <div class="lightbox-backdrop"></div>

  <header class="lightbox-header">
    <div id="lightbox-counter" class="lightbox-counter" aria-live="polite" hidden>
      <span id="lightbox-index" class="lightbox-counter-current">01</span>
      <span class="lightbox-counter-sep" aria-hidden="true">/</span>
      <span id="lightbox-total" class="lightbox-counter-total">01</span>
    </div>

    <div class="lightbox-actions">
      <div class="lightbox-toolbar" role="toolbar" aria-label="Image controls">
        <button id="lightbox-zoom-out" class="lightbox-tool-btn lightbox-tool-btn--zoom" type="button" aria-label="Zoom out" title="Zoom out (-)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
          </svg>
        </button>
        <button id="lightbox-zoom-reset" class="lightbox-zoom-level" type="button" aria-label="Reset zoom" title="Reset zoom (0)">100%</button>
        <button id="lightbox-zoom-in" class="lightbox-tool-btn lightbox-tool-btn--zoom" type="button" aria-label="Zoom in" title="Zoom in (+)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
        </button>
        <span class="lightbox-toolbar-sep" aria-hidden="true"></span>
        <a id="lightbox-open-original" class="lightbox-tool-btn" target="_blank" rel="noopener noreferrer" aria-label="Open original image" title="Open original">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6" />
            <path d="M11 13l9 -9" />
            <path d="M15 4h5v5" />
          </svg>
        </a>
      </div>

      <button id="lightbox-close" class="lightbox-btn-close" type="button" aria-label="Close image viewer" title="Close (Esc)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6l-12 12" />
          <path d="M6 6l12 12" />
        </svg>
      </button>
    </div>
  </header>

  <div id="lightbox-stage" class="lightbox-stage">
    <div id="lightbox-content" class="lightbox-content">
      <div class="lightbox-loader" aria-hidden="true"></div>
      <img id="lightbox-img" alt="Fullscreen view" draggable="false" />
    </div>
  </div>

  <button id="lightbox-prev" class="lightbox-nav lightbox-nav--prev" type="button" aria-label="Previous image" title="Previous (Left Arrow)">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 6l-6 6l6 6" />
    </svg>
  </button>
  <button id="lightbox-next" class="lightbox-nav lightbox-nav--next" type="button" aria-label="Next image" title="Next (Right Arrow)">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 6l6 6l-6 6" />
    </svg>
  </button>

  <footer id="lightbox-caption-bar" class="lightbox-caption-bar" hidden>
    <p id="lightbox-caption" class="lightbox-caption"></p>
  </footer>
</div>
