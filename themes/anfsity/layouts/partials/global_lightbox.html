<div id="elegant-lightbox" class="elegant-lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true" tabindex="-1" inert>
  <div class="lightbox-backdrop"></div>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="Fullscreen view" />

    <button id="lightbox-prev" class="lightbox-btn" type="button" aria-label="Previous image" title="Left Arrow">
      <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
        <path fill="currentColor" d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z" />
      </svg>
    </button>
    <button id="lightbox-next" class="lightbox-btn" type="button" aria-label="Next image" title="Right Arrow">
      <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
        <path fill="currentColor" d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z" />
      </svg>
    </button>
  </div>

  <button id="lightbox-close" class="lightbox-btn-close" type="button" aria-label="Close image viewer" title="Esc">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
      <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
    </svg>
  </button>
</div>
