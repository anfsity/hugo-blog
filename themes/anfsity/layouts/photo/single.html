{{- define "body-class" -}}photo-page{{- end -}}

{{- define "main" -}}
<article class="photo-gallery-page">
  <header class="photo-page-header">
    <div class="photo-header-bar">
      <div class="photo-header-title">
        <h3 class="section-title">{{ .Title }}</h3>
        <span id="photo-wall-count" class="photo-wall-count" aria-live="polite" hidden></span>
      </div>

      <div class="photo-header-tools" role="toolbar" aria-label="Gallery controls">
        <div class="photo-density-group" role="group" aria-label="Layout density">
          <button
            id="photo-density-cozy"
            class="photo-tool-btn is-active"
            type="button"
            data-density="cozy"
            aria-pressed="true"
            aria-label="Spacious layout"
            title="Spacious layout"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="5" width="7" height="6" rx="1.5" />
              <rect x="13" y="5" width="7" height="6" rx="1.5" />
              <rect x="4" y="13" width="10" height="6" rx="1.5" />
              <rect x="16" y="13" width="4" height="6" rx="1.5" />
            </svg>
          </button>
          <button
            id="photo-density-compact"
            class="photo-tool-btn"
            type="button"
            data-density="compact"
            aria-pressed="false"
            aria-label="Compact layout"
            title="Compact layout"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="4" width="4.5" height="4.5" rx="1" />
              <rect x="9.75" y="4" width="4.5" height="4.5" rx="1" />
              <rect x="15.5" y="4" width="4.5" height="4.5" rx="1" />
              <rect x="4" y="9.75" width="6.5" height="4.5" rx="1" />
              <rect x="12.5" y="9.75" width="7.5" height="4.5" rx="1" />
              <rect x="4" y="15.5" width="4.5" height="4.5" rx="1" />
              <rect x="10.5" y="15.5" width="9.5" height="4.5" rx="1" />
            </svg>
          </button>
        </div>

        <span class="photo-tools-sep" aria-hidden="true"></span>

        <button
          id="photo-wall-refresh"
          class="photo-tool-btn photo-refresh-btn"
          type="button"
          aria-label="Shuffle a new batch"
          title="Shuffle"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
            <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
          </svg>
        </button>
      </div>
    </div>

    {{ with .Description }}
    <p class="photo-page-subtitle">{{ . }}</p>
    {{ end }}
  </header>

  <section class="photo-page-content">
    {{ .Content }}

    <div class="gallery-wrapper" id="fluent-gallery-wrapper" data-density="cozy">
      <div class="photo-wall-skeleton" id="photo-wall-skeleton" aria-hidden="true">
        <div class="photo-skeleton-row">
          <div class="photo-skeleton-tile" style="flex: 1.45 0 0%"></div>
          <div class="photo-skeleton-tile" style="flex: 0.78 0 0%"></div>
          <div class="photo-skeleton-tile" style="flex: 1.15 0 0%"></div>
        </div>
        <div class="photo-skeleton-row">
          <div class="photo-skeleton-tile" style="flex: 0.85 0 0%"></div>
          <div class="photo-skeleton-tile" style="flex: 1.6 0 0%"></div>
          <div class="photo-skeleton-tile" style="flex: 0.92 0 0%"></div>
        </div>
      </div>

      <div class="photo-wall" id="fluent-gallery"></div>

      <div class="loading-more" id="loading-indicator" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <span id="fluent-gallery-status" class="loading-more-status">Curating works...</span>
        <button id="fluent-gallery-retry" class="fluent-gallery-retry" type="button" hidden>Retry</button>
      </div>
    </div>
  </section>

  <footer class="photo-page-footer">{{ partial "footer/footer" . }}</footer>
</article>
{{- end -}}
