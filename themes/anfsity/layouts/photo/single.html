{{- define "body-class" -}}photo-page{{- end -}}

{{- define "main" -}}
<article class="photo-gallery-page">
  <header class="photo-page-header">
    <h3 class="section-title">{{ .Title }}</h3>
    {{ with .Params.description }}
    <p class="photo-page-subtitle">{{ . }}</p>
    {{ end }}
  </header>

  <section class="photo-page-content">
    {{ .Content }}

    <div class="gallery-wrapper" id="fluent-gallery-wrapper">
      <div class="fluent-grid" id="fluent-gallery"></div>
      <div class="loading-more" id="loading-indicator" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <span id="fluent-gallery-status">Loading...</span>
        <button id="fluent-gallery-retry" class="fluent-gallery-retry" type="button" hidden>Retry</button>
      </div>
    </div>
  </section>

  <footer class="photo-page-footer">{{ partial "footer/footer" . }}</footer>
</article>
{{- end -}}
