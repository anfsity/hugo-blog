{{- define "main" -}}
<article class="main-article photo-gallery-page">
  <header class="main-article-header">
    {{ partial "article/components/header" . }}
  </header>

  <section class="main-article-content">
    {{ .Content }}

    <div class="gallery-wrapper" id="fluent-gallery-wrapper">
      <div class="fluent-grid" id="fluent-gallery"></div>
      <div class="loading-more" id="loading-indicator" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <span>Loading...</span>
      </div>
    </div>
  </section>

  <footer class="main-article-footer">{{ partial "footer/footer" . }}</footer>
</article>
{{- end -}}
